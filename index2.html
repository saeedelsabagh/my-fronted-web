<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel="stylesheet" href="c.css">
</head>

<body>
    <div class="back">
    <a href="#" onclick="goBack()" return false;>🏠</a>
    </div>
    <!-- Post -->
    <main class="post-container2" id="postcontainer2">

        <div class="post-card2">

            <!-- User -->
            <div class="post-header2" id="post-header2">

                <div class="avatar2" id="avatar2">
                    👨
                </div>

                <strong id="na">@yarhmm</strong>

            </div>


            <!-- Image -->
            <img class="post-image2" src="https://images.unsplash.com/photo-1511497584788-876760111969" alt="Tree">


            <!-- Post Content -->
            <div class="post-content2">

                <div class="time2" id="time2">
                    2 min ago
                </div>

                <h3 id="he">
                    Special title treatment
                </h3>

                <p id="pe">
                    With supporting text below as a natural lead-in
                    to additional content.
                </p>

            </div>


            <!-- Comments -->
            <div class="comments2">

                <span>✎</span>

                <span>(3) Comments</span>

            </div>
            <!-- Comments List -->
            <div class="comments-list2" id="commentbody2">

                <!-- أول تعليق -->
                <div class="comment2">

                    <div class="comment-avatar2">
                        👨
                    </div>

                    <div class="comment-body2">
                        <strong>rashadHassanIbrahim</strong>
                        <p>Sad qui voluptate quo consequatur doloremque autem.</p>
                    </div>

                </div>
            </div>

            <!-- هنا هيتضاف التعليقات الجديدة -->


            <!-- Add Comment -->
            <div class="add-comment2">

                <input id="writecomment" type="text" placeholder="Add your comment...">

                <button id="send">Send</button>

            </div>


        </div>

    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
